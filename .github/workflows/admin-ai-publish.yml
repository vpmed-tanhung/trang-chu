name: Phát hành danh mục đã được Dược sĩ duyệt
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vpmed-admin-ai-publisher
  cancel-in-progress: false
jobs:
  publish-approved:
    if: github.repository == 'vpmed-tanhung/trang-chu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
      - name: Kiểm tra và phát hành bản đã duyệt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/admin_ai_publish.py
