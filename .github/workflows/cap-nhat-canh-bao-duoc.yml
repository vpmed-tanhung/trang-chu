name: Cập nhật dữ liệu Cảnh báo dược

on:
  schedule:
    # GitHub Actions dùng UTC: 23:00 UTC = 06:00 sáng hôm sau tại Việt Nam.
    - cron: "0 23 * * *"
    # Lượt dự phòng 06:30 chỉ chạy lại khi lượt 06:00 chưa cập nhật thành công.
    - cron: "30 23 * * *"

permissions:
  contents: write

concurrency:
  group: cap-nhat-canh-bao-duoc
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện thu thập dữ liệu
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-cache-dir
          "requests>=2.31,<3"
          "beautifulsoup4>=4.12,<5"

      - name: Kiểm tra bộ tóm tắt và liên kết nguồn
        run: python -m unittest tests/test_update_pharmacovigilance.py

      - name: Lấy và tóm tắt cảnh báo mới
        run: python scripts/update_pharmacovigilance.py --skip-if-fresh

      - name: Kiểm tra dữ liệu đầu ra
        run: |
          python -m json.tool assets/pharmacovigilance_auto.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("assets/pharmacovigilance_auto.json").read_text(encoding="utf-8")
          )
          alerts = payload.get("alerts")
          if not payload.get("generated_at"):
              raise SystemExit("Thiếu generated_at.")
          if not isinstance(alerts, list):
              raise SystemExit("Trường alerts không phải danh sách.")
          for index, alert in enumerate(alerts):
              label = f"Cảnh báo #{index + 1}"
              for field in ("title", "drugs", "summary", "source", "url"):
                  if not str(alert.get(field, "")).strip():
                      raise SystemExit(f"{label} thiếu trường {field}.")
              if len(str(alert["summary"]).strip()) < 120:
                  raise SystemExit(f"{label} có tóm tắt quá ngắn.")
              if not str(alert["url"]).startswith(
                  "https://canhgiacduoc.org.vn/CanhGiacDuoc/DiemTin/"
              ):
                  raise SystemExit(f"{label} không có URL trực tiếp đến bài nguồn.")
              section_items = []
              for field in ("risk", "signs", "action", "monitor"):
                  values = alert.get(field)
                  if not isinstance(values, list) or not values:
                      raise SystemExit(f"{label} thiếu nội dung {field}.")
                  section_items.extend(str(value).strip().casefold() for value in values)
              if len(section_items) != len(set(section_items)):
                  raise SystemExit(f"{label} có câu trùng giữa các mục tóm tắt.")
          print(f"Dữ liệu hợp lệ: {len(alerts)} cảnh báo.")
          PY

      - name: Lưu dữ liệu mới vào nhánh chính
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/pharmacovigilance_auto.json \
            assets/pharmacovigilance_auto_data.js \
            index.html
          if git diff --cached --quiet; then
            echo "Không có thay đổi cần lưu."
            exit 0
          fi
          git commit -m "chore: cập nhật cảnh báo dược tự động"
          git push
