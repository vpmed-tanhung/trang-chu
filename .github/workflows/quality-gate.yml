name: Kiểm tra chất lượng VPMED

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Cài Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cài thư viện kiểm thử
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt

      - name: Kiểm tra cú pháp JavaScript
        shell: bash
        run: find assets tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Chạy unit test JavaScript
        shell: bash
        run: |
          for test_file in tests/*.js; do
            node "$test_file"
          done

      - name: Chạy unit test Python
        run: python -m pytest -q

      - name: Kiểm tra JSON và SHA256
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool assets/app-version.json >/dev/null
          python scripts/update_sha256sums.py --check
